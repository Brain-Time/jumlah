  # ACHTUNG: assets/fonts/Amiri-Regular.ttf ist aktuell eine leere
  # Platzhalter-Datei (0 Bytes). Die echte Schriftdatei muss noch von
  # https://github.com/aliftype/amiri (SIL Open Font License) besorgt und
  # ersetzt werden, sonst schlaegt das Rendering mit dieser Font fehl.
  fonts:
    - family: Amiri
      fonts:
        - asset: assets/fonts/Amiri-Regular.ttf
